name: Build CreativeBox

'on':
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package -B
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: CreativeBox-jar
          path: target/CreativeBox-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: CreativeBox-jar
          path: artifacts
        
      - name: Count existing releases and set tag
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 2>/dev/null | wc -l)
          NEXT=$((TAG_COUNT + 1))
          echo "tag=v${NEXT}" >> $GITHUB_OUTPUT
          echo "name=CreativeBox v${NEXT}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.count.outputs.tag }}
          name: ${{ steps.count.outputs.name }}
          files: artifacts/CreativeBox-*.jar
