name: CreativeBox
version: '1.0-SNAPSHOT'
main: com.bionic.creativebox.CreativeBoxPlugin
api-version: '1.20'
author: bionic
description: Isolated creative sandbox world with fixed spawn and full inventory isolation.

commands:
  sb:
    description: Enter or leave the creative sandbox
    usage: /sb [reload|setspawn|reset|<player>]
    aliases: [sandbox, goc]

permissions:
  creativebox.use:
    default: true
  creativebox.admin:
    default: op
