name: Build LiveLens

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package -B
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: LiveLens-jar
          path: target/LiveLens-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LiveLens-jar
          path: artifacts
        
      - name: Count existing releases
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 2>/dev/null | wc -l)
          echo "tag_count=$TAG_COUNT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.count.outputs.tag_count + 1 }}
          name: LiveLens v${{ steps.count.outputs.tag_count + 1 }}
          files: artifacts/LiveLens-*.jar

