name: Build Plugins

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-livelens:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build LiveLens with Maven
        working-directory: ./LiveLens
        run: mvn clean package -B
        
      - name: Upload LiveLens artifact
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: livelens-jar
          path: LiveLens/target/LiveLens-*.jar

  build-creativebox:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build CreativeBox with Maven
        working-directory: ./CreativeBox
        run: mvn clean package -B
        
      - name: Upload CreativeBox artifact
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: creativebox-jar
          path: CreativeBox/target/CreativeBox-*.jar

  release-livelens:
    needs: build-livelens
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: livelens-jar
          path: artifacts
        
      - name: Count existing releases and set tag
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 2>/dev/null | wc -l)
          NEXT=$((TAG_COUNT + 1))
          echo "tag=v${NEXT}" >> $GITHUB_OUTPUT
          echo "name=LiveLens v${NEXT}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.count.outputs.tag }}
          name: ${{ steps.count.outputs.name }}
          files: artifacts/LiveLens-*.jar

  release-creativebox:
    needs: build-creativebox
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: creativebox-jar
          path: artifacts
        
      - name: Count existing releases and set tag
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 --json name | grep -c '"name"')
          NEXT=$((TAG_COUNT + 1))
          echo "tag=v${NEXT}" >> $GITHUB_OUTPUT
          echo "name=CreativeBox v${NEXT}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cb-${{ steps.count.outputs.tag }}
          name: CreativeBox v${{ steps.count.outputs.tag }}
          files: artifacts/CreativeBox-*.jar
