name: Build LiveLens Plugin

on:
  push:
    branches: [ main ]
  pull-request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21 (required for Paper API 1.21+)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -B
        
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveLens-plugin
          path: target/LiveLens-*.jar