name: Build Plugins

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21 (for LiveLens)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build all modules with Maven
        run: mvn clean package -B
        
      - name: Upload artifacts to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: plugin-jars
          path: |
            LiveLens/target/*.jar
            CreativeBox/target/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Count existing releases for versioning  
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 2>/dev/null | wc -l)
          echo "tag_count=$TAG_COUNT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: artifacts
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.count.outputs.tag_count }}
          name: Plugin Release ${{ steps.count.outputs.tag_count }}
          files: |
            artifacts/LiveLens-*.jar
            artifacts/CreativeBox-*.jar

