name: Build LiveLens Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21 (required for Paper API 1.21+)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -B
        
      - name: Upload artifact to Actions Artifacts
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: LiveLens-plugin
          path: target/LiveLens-*.jar
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Count existing releases for versioning  
        id: count
        run: |
          TAG_COUNT=$(gh release list --limit 1000 2>/dev/null | wc -l)
          echo "tag_count=$TAG_COUNT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          path: .
      
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ steps.count.outputs.tag_count }}
          name: LiveLens v1.0.${{ steps.count.outputs.tag_count }}
          generateReleaseNotes: true
          artifacts: "LiveLens-*.jar"
