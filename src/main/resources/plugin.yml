name: LiveLens
version: ${project.version}
main: me.bionic.livelens.LiveLens
api-version: 1.20
description: A dynamic camera system for Minecraft that follows active players and supports livestreaming to Bilibili/Douyin via RTMP.
author: Bionic Agent

commands:
  livelens:
    description: Main command for LiveLens plugin
    usage: /<command> [god|first|orbit|switch|status|live]
    permission: livelens.use
    permission-message: You don't have permission to use this command!

permissions:
  livelens.use:
    description: Allows using LiveLens commands
    default: true
  livelens.stream.start:
    description: Allows starting a livestream push (Bilibili/Douyin RTMP)
    default: op
