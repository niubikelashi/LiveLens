# ============================================================
#  LiveLens — Minecraft \u00b7 Server Plugin Configuration
#  Compatible with Paper / Spigot 1.20.1+
# ============================================================

# --- Camera System ---
camera:
  # God View height (vertical distance above player)
  god-view:
    height: 15.0
    back-offset: 8.0  
  smooth-speed: 0.1   # Smooth movement speed (0.0 ~ 1.0, higher = faster)

  # Orbit View settings
  orbit-view:
    radius: 10.0            # Rotation radius (horizontal distance from player)
    height: 5.0             # Height offset (vertical above player head)
    rotation-speed: 0.02    # Rotation speed (radians/tick, higher = faster)

# --- Auto-Tracking System ---
tracking:
  interval-ticks: 1       # Activity detection interval (ticks; 20 ticks/sec = 1 tick)
  decay-factor: 0.95      # Score decay factor (lower = faster decay)

# --- Logging ---
logging:
  enable: true
  log-camera-position: false  # Log camera coordinates every tick (for debugging)